<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Contact FakeUGC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one question per screen, left-aligned in a narrow column, a thin progress line pinned to the top. */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E4E4E2;
  --accent:#141414; --accent-ink:#FFFFFF; --soft:#F1F1EF;
  --display:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --surface:#181818; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
    --accent:#F2F2F2; --accent-ink:#111111; --soft:#222222; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#181818; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --accent:#F2F2F2; --accent-ink:#111111; --soft:#222222; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.progress{position:fixed;inset:0 0 auto;height:calc(3px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.progress span{display:block;height:3px;width:0;background:var(--accent);transition:width .35s ease}
.wrap{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 32px}
.brand{max-width:620px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:13px}
.brand b{color:var(--ink);font-weight:600;letter-spacing:.01em}
main{flex:1;display:flex;align-items:center}
.step{max-width:620px;width:100%;margin:0 auto;padding-block:32px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:14px}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.025em;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,6vw,48px)}
h2{font-size:clamp(24px,4.6vw,34px)}
h1 em,h2 em{font-style:normal}
.help{color:var(--muted);margin:14px 0 0;max-width:52ch;overflow-wrap:anywhere}
.field{margin-top:28px}
input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;border-radius:0;outline:none;transition:border-color .2s}
textarea{resize:none;min-height:110px;font-size:18px;line-height:1.5}
input:focus,textarea:focus{border-bottom-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.choices{display:grid;gap:10px;margin-top:28px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent)}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--soft)}
.key{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.choice[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;align-items:center;gap:16px;margin-top:28px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:999px;padding:13px 24px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);padding:13px 8px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.error{color:#C2412D;font-size:14px;min-height:20px;margin-top:10px}
:root[data-theme="dark"] .error{color:#FF8F7A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .error{color:#FF8F7A}}
.list{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:flex;gap:12px;color:var(--ink)}
.list li::before{content:"";flex:none;width:6px;height:6px;margin-top:10px;border-radius:50%;background:var(--accent)}
.summary{margin-top:24px;border-top:1px solid var(--line)}
.summary div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.summary dt{color:var(--muted)} .summary dd{margin:0;overflow-wrap:anywhere}
.foot{max-width:620px;width:100%;margin:0 auto;color:var(--muted);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fade > *{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.fade > *:nth-child(2){animation-delay:.06s}.fade > *:nth-child(3){animation-delay:.12s}.fade > *:nth-child(4){animation-delay:.18s}.fade > *:nth-child(5){animation-delay:.24s}.fade > *:nth-child(6){animation-delay:.3s}
.choices .choice{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.choices .choice:nth-child(1){animation-delay:.16s}.choices .choice:nth-child(2){animation-delay:.22s}.choices .choice:nth-child(3){animation-delay:.28s}.choices .choice:nth-child(4){animation-delay:.34s}.choices .choice:nth-child(5){animation-delay:.4s}
.choice{transition:border-color .15s,background .15s,transform .15s}
.choice:hover{transform:translateY(-2px)}
.choice[aria-checked="true"]{animation:pop .28s ease}
.btn{transition:transform .15s ease,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.arr{display:inline-block;transition:transform .2s ease}
.btn:hover .arr{transform:translateX(4px)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.steps li{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:17px;transition:color .3s}
.steps li .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .3s,border-color .3s}
.steps li.active{color:var(--ink)}
.steps li.active .dot{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--ink);border-color:var(--ink);animation:pop .3s ease}
.steps li.done .dot::after{content:"";width:6px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.tick{width:52px;height:52px}
.tick circle{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s ease forwards}
.tick path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s ease .5s forwards}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes draw{to{stroke-dashoffset:0}}
.review{display:grid;gap:22px}
.spinner{width:28px;height:28px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rvbar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;max-width:360px}
.rvbar span{display:block;height:100%;width:0;background:var(--ink);transition:width 6s linear}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade > *,.choices .choice,.choice[aria-checked="true"],.steps li .dot,.tick circle,.tick path{animation:none!important}.tick circle,.tick path{stroke-dashoffset:0}.progress span{transition:none}.spinner{animation:none}.choice:hover,.btn:hover{transform:none}}
@media (max-width:480px){.summary div{grid-template-columns:1fr;gap:2px}}

.choice .sub{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.choice .txt{display:block}
.paths{display:grid;gap:12px;margin-top:28px}
.paths .choice{padding:18px 18px}
.paths .choice b{font-weight:600}
</style>

<div class="progress" aria-hidden="true"><span id="bar"></span></div>
<div class="wrap">
  <div class="brand"><b>FakeUGC</b></div>
  <main><section class="step" id="step" aria-live="polite"></section></main>
  <div class="foot" id="foot">18+ only.</div>
</div>

<script>
/* ===== Settings Bruce fills in ===== */
const CALENDLY_URL = "https://calendly.com/fakeugcaiofm/30min"; // "Mentorship call" event; custom questions a1-a8 match the mentorship order below
const LAB_URL = "https://www.skool.com/ai-ofm-ai-ugc-2941/about";
const WORK_EMAIL = "fakeugcaiofm@gmail.com"; // the FakeUGC inbox that receives "Work with me" enquiries (sent through formsubmit.co; the first one asks you to confirm by email)

/* ===== Mentorship questions (Calendly custom questions a1..a8 must stay in this order) ===== */
const MENTOR = [
  {id:"adult", type:"choice", title:"First things first. Are you <em>18 or over?</em>", options:["Yes, I'm 18+","No"]},
  {id:"name", type:"text", title:"What should I call you?", placeholder:"Your first name", required:true, calendly:"name"},
  {id:"handle", type:"text", title:"Where can I find you online?", help:"Your X or Instagram handle.", placeholder:"@yourhandle", required:true, calendly:"a1"},
  {id:"email", type:"email", title:"Best email for the call invite?", placeholder:"you@email.com", required:true, calendly:"email"},
  {id:"stage", type:"choice", title:"Where are you at with your <em>AI model</em> right now?", options:["Haven't started yet","Building my model","Posting, but not making money yet","Already making money"], calendly:"a2"},
  {id:"goal", type:"long", title:"Where do you want to be <em>90 days</em> from now?", help:"Be specific.", placeholder:"e.g. my model posting daily and my page making its first sales", required:true, calendly:"a3"},
  {id:"stuck", type:"long", title:"What's stopping you from getting there <em>on your own?</em>", placeholder:"e.g. my model looks different in every picture", required:true, calendly:"a4"},
  {id:"hours", type:"choice", title:"How many hours a week can you give this?", options:["Under 5","5 to 10","10 to 20","20+"], calendly:"a5"},
  {id:"invest", type:"choice", title:"How much are you willing to invest in <em>getting this right?</em>", help:"Mentorship is a paid 1-on-1 programme. Pick what you could put in if it's a fit.", options:["Under $500","$500 to $1,000","$1,000 to $2,500","$2,500+"], calendly:"a6"},
  {id:"start", type:"choice", title:"If we're a fit, how soon could you <em>start?</em>", options:["This week","Within 2 weeks","Within a month","Not sure yet"], calendly:"a7"},
  {id:"notes", type:"long", title:"Anything else I should know?", help:"Optional.", placeholder:"Optional", required:false, calendly:"a8"}
];

/* ===== Work with me questions ===== */
const WORK = [
  {id:"name", type:"text", title:"What's your name?", placeholder:"Your name", required:true},
  {id:"email", type:"email", title:"Best email to reach you?", placeholder:"you@company.com", required:true},
  {id:"brand", type:"text", title:"Your business, brand or handle?", placeholder:"e.g. Glow Labs, glowlabs.com", required:true},
  {id:"need", type:"choice", title:"What do you need?", options:["UGC ads","AI influencer content","Short-form videos","A custom AI model","Something else"]},
  {id:"brief", type:"long", title:"Tell me a bit about it.", help:"What it's for and any links.", placeholder:"e.g. 5 short videos for our skincare serum", required:true},
  {id:"budget", type:"choice", title:"What's the <em>budget?</em>", options:["Under $500","$500 to $1,000","$1,000 to $2,500","$2,500 to $5,000","$5,000+"]}
];

let PATH = null, Q = [];
let A = {};
let i = -1; // -1 = home
const el = document.getElementById("step");
const bar = document.getElementById("bar");
const foot = document.getElementById("foot");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function plain(t){return t.replace(/<[^>]+>/g,"")}
function visible(){return Q.filter(q=>!q.when||q.when())}
function setBar(){const v=visible();const k=v.indexOf(Q[i]);bar.style.width=(i<0?0:i>=Q.length?100:(k/v.length)*100)+"%"}
function nextIdx(n){while(n<Q.length&&Q[n].when&&!Q[n].when()) n++; return n}
function prevIdx(n){while(n>=0&&Q[n].when&&!Q[n].when()) n--; return n}

function home(){
  PATH=null;i=-1;bar.style.width="0%";foot.textContent="18+ only.";
  el.innerHTML=`<div class="fade">
    <h1>Get in touch</h1>
    <p class="help">Choose an option below, <a href="https://x.com/FakeUGC" target="_blank" rel="noopener" style="color:inherit">message me on X</a>, or email <a href="mailto:${WORK_EMAIL}" style="color:inherit">${WORK_EMAIL}</a>.</p>
    <div class="paths choices" role="list">
      <button type="button" class="choice" data-p="mentor"><span class="key">A</span><span><span class="txt"><b>1-on-1 mentorship</b></span></span></button>
      <button type="button" class="choice" data-p="work"><span class="key">B</span><span><span class="txt"><b>Work with me</b></span></span></button>
    </div>
  </div>`;
  const b=[...el.querySelectorAll(".choice")];
  b.forEach(x=>x.onclick=()=>start(x.dataset.p));
  b[0].focus();
}

function start(p){
  PATH=p;Q=p==="mentor"?MENTOR:WORK;A={};
  foot.textContent=p==="mentor"?"18+ only. No income is promised: results depend on your work.":"18+ only.";
  p==="mentor"?intro():show(0);
}

function intro(){
  i=-1;bar.style.width="0%";
  const mentor=PATH==="mentor";
  el.innerHTML=`<div class="fade">
    <h1>${mentor?"Apply for 1-on-1 mentorship":"Tell me about your project"}</h1>
    <p class="help">${mentor?"About 3 minutes. If it's a fit, you'll book a call straight after.":"About 3 minutes. I'll read it and get back to you by email."}</p>
    <div class="actions"><button class="btn" id="go" type="button">Start</button><button class="btn ghost" id="home" type="button">← Back</button><span class="hint">press Enter ↵</span></div>
  </div>`;
  const go=document.getElementById("go");go.onclick=()=>show(0);go.focus();
  document.getElementById("home").onclick=home;
}

function show(n){
  n=nextIdx(n);i=n;setBar();
  if(i>=Q.length) return finish();
  const q=Q[i];
  const v=visible();
  const val=A[q.id]??"";
  let input="";
  if(q.type==="text"||q.type==="email"){
    input=`<div class="field"><input id="in-${q.id}" type="${q.type==="email"?"email":"text"}" autocomplete="${q.id==="name"?"name":q.id==="email"?"email":"off"}" placeholder="${esc(q.placeholder||"")}" value="${esc(val)}" aria-label="${esc(plain(q.title))}"></div>`;
  }else if(q.type==="long"){
    input=`<div class="field"><textarea id="in-${q.id}" placeholder="${esc(q.placeholder||"")}" aria-label="${esc(plain(q.title))}">${esc(val)}</textarea></div>`;
  }else{
    input=`<div class="choices" role="radiogroup" aria-label="${esc(plain(q.title))}">`+
      q.options.map((o,k)=>`<button type="button" class="choice" role="radio" aria-checked="${val===o}" data-v="${esc(o)}"><span class="key">${String.fromCharCode(65+k)}</span><span>${esc(o)}</span></button>`).join("")+`</div>`;
  }
  const last=nextIdx(i+1)>=Q.length;
  el.innerHTML=`<div class="fade">
    <div class="count">${v.indexOf(q)+1} of ${v.length}</div>
    <h2>${q.title}</h2>
    ${q.help?`<p class="help">${q.help}</p>`:""}
    ${input}
    <div class="error" id="err"></div>
    <div class="actions">
      ${q.type==="choice"?"":`<button class="btn" id="next" type="button">${last?"Finish":"OK"}</button><span class="hint">${q.type==="long"?"Shift + Enter for a new line":"press Enter ↵"}</span>`}
      <button class="btn ghost" id="back" type="button">← Back</button>
    </div>
  </div>`;
  document.getElementById("back").onclick=()=>{const p=prevIdx(i-1); p<0?(PATH==="mentor"?intro():home()):show(p)};
  if(q.type==="choice"){
    const btns=[...el.querySelectorAll(".choice")];
    btns.forEach(b=>b.onclick=()=>pick(q,b.dataset.v));
    (btns.find(b=>b.getAttribute("aria-checked")==="true")||btns[0]).focus();
  }else{
    document.getElementById("in-"+q.id).focus();
    document.getElementById("next").onclick=()=>submitText(q);
  }
}

let picking=false;
function pick(q,v){
  if(picking) return;
  picking=true;
  const at=i;
  A[q.id]=v;
  el.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-checked",b.dataset.v===v));
  if(q.id==="adult"&&v==="No"){ setTimeout(()=>{picking=false;underage()},220); return; }
  setTimeout(()=>{picking=false;show(at+1)},220);
}

function submitText(q){
  const f=document.getElementById("in-"+q.id);
  const v=f.value.trim();
  const err=document.getElementById("err");
  if(q.required&&!v){err.textContent="Please answer this one to continue.";f.focus();return}
  if(q.type==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){err.textContent="That email doesn't look right. Check it and try again.";f.focus();return}
  A[q.id]=v; show(i+1);
}

function stop(title,text,backTo){
  i=Q.length;bar.style.width="100%";
  el.innerHTML=`<div class="fade"><h2>${title}</h2><p class="help">${text}</p><div class="actions"><button class="btn ghost" id="back" type="button">← Back</button></div></div>`;
  document.getElementById("back").onclick=()=>show(backTo);
}
function underage(){ stop("Thanks for being honest.", PATH==="mentor"?"This mentorship is for adults only, so I can't take you on. Come back when you're 18.":"I only work with adults, so I can't take this on. Come back when you're 18.", 0); }

function workFit(){ return A.budget!=="Under $500"; }
function isFit(){
  return A.adult!=="No" && A.hours!=="Under 5" && A.invest!=="Under $500" && A.start!=="Not sure yet";
}

function calendlyLink(){
  if(!CALENDLY_URL) return "";
  const p=new URLSearchParams();
  Q.forEach(q=>{ if(q.calendly&&A[q.id]) p.set(q.calendly,A[q.id]); });
  return CALENDLY_URL+(CALENDLY_URL.includes("?")?"&":"?")+p.toString();
}

function answered(){return visible().filter(q=>q.id!=="adult"&&A[q.id])}
function summary(){
  return `<dl class="summary">`+answered().map(q=>`<div><dt>${esc(plain(q.title))}</dt><dd>${esc(A[q.id])}</dd></div>`).join("")+`</dl>`;
}
function briefText(){return answered().map(q=>`${plain(q.title)}\n${A[q.id]}`).join("\n\n")}
function gmailLink(){
  return "https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(WORK_EMAIL)+"&su="+encodeURIComponent("Project enquiry: "+(A.need||"")+" ("+(A.brand||A.name||"")+")")+"&body="+encodeURIComponent(briefText());
}
function mailtoLink(){
  return "mailto:"+WORK_EMAIL+"?subject="+encodeURIComponent("Project enquiry: "+(A.need||"")+" ("+(A.brand||A.name||"")+")")+"&body="+encodeURIComponent(briefText());
}

let sent=null;
function send(){
  if(!WORK_EMAIL) return Promise.resolve(false);
  const data={_subject:"New project enquiry: "+(A.need||"")+" from "+(A.brand||A.name||""),_template:"table",_captcha:"false",_replyto:A.email||""};
  answered().forEach(q=>{data[plain(q.title)]=A[q.id]});
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),9000);
  const req=fetch("https://formsubmit.co/ajax/"+encodeURIComponent(WORK_EMAIL),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(data),signal:ctl.signal})
    .then(r=>r.ok?r.json().then(j=>String(j.success)==="true").catch(()=>true):false).catch(()=>false)
    .finally(()=>clearTimeout(timer));
  return Promise.race([req,new Promise(res=>setTimeout(()=>res(false),9500))]);
}

let reviewTimer=null;
function finish(){
  i=Q.length;bar.style.width="100%";
  const mentor=PATH==="mentor";
  if(!mentor&&workFit()) sent=send();
  const steps=mentor?["Reviewing your answers","Looking at where you're at","Working out the right next step"]:["Reading your brief","Sending it over"];
  el.innerHTML=`<div class="fade review" role="status">
    <h2>Hang tight, ${esc(A.name||"")}</h2>
    <ul class="steps">${steps.map((t,k)=>`<li id="st${k}"${k===0?' class="active"':""}><span class="dot" aria-hidden="true"></span>${t}</li>`).join("")}</ul>
    <div class="rvbar" aria-hidden="true"><span id="rvfill"></span></div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=document.getElementById("rvfill");if(f){if(!mentor)f.style.transitionDuration="3s";f.style.width="100%"}}));
  let s=0;clearInterval(reviewTimer);
  reviewTimer=setInterval(()=>{
    const cur=document.getElementById("st"+s); if(cur){cur.classList.remove("active");cur.classList.add("done")}
    s++; const nx=document.getElementById("st"+s); if(nx) nx.classList.add("active");
  },mentor?2000:1600);
  setTimeout(()=>{clearInterval(reviewTimer); mentor?result():workFit()?(sent||Promise.resolve(false)).then(workResult):lowBudget()},mentor?6400:3400);
}

function lowBudget(){
  el.innerHTML=`<div class="fade">
    <h2>Thanks, ${esc(A.name||"you")}.</h2>
    <p class="help">My projects start above $500, so I'm not the right fit at this budget. If it grows, come back and tell me about it.</p>
    <div class="actions"><button class="btn ghost" id="again" type="button">Change my answers</button></div>
  </div>`;
  document.getElementById("again").onclick=()=>show(Q.findIndex(q=>q.id==="budget"));
}

      <svg class="tick" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M16 27l7 7 13-14"/></svg>
      <h2>Got it, ${esc(A.name||"you")}. <em>I'll be in touch.</em></h2>
      <p class="help">You'll hear back at ${esc(A.email||"your email")}.</p>
      <div class="actions"><button class="btn ghost" id="again" type="button">Back to start</button></div>
      ${summary()}
    </div>`;
  }else{
    el.innerHTML=`<div class="fade">
      <h2>One last step, ${esc(A.name||"you")}.</h2>
      <p class="help">Send me your brief by email and I'll get back to you. Everything you wrote is already filled in.</p>
      <div class="actions">
        <a class="btn" href="${esc(gmailLink())}" target="_blank" rel="noopener">Send with Gmail <span class="arr">→</span></a>
        <a class="btn ghost" href="${esc(mailtoLink())}">Use my email app</a>
        <button class="btn ghost" id="copy" type="button">Copy my brief</button>
      </div>
      <p class="hint" id="copied">Or email it to <a href="mailto:${WORK_EMAIL}" style="color:inherit">${WORK_EMAIL}</a>.</p>
      <div class="actions"><button class="btn ghost" id="again" type="button">Back to start</button></div>
      ${summary()}

  }
  document.getElementById("again").onclick=home;

  if(c) c.onclick=()=>{const t="To: "+WORK_EMAIL+"\n\n"+briefText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{c.textContent="Copied"}).catch(()=>{c.textContent="Couldn't copy"})};

function result(){
  if(isFit()){
    const link=calendlyLink();
    el.innerHTML=`<div class="fade">
      <svg class="tick" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M16 27l7 7 13-14"/></svg>
      <h2>Nice, ${esc(A.name||"you")}. You look like a <em>good fit.</em></h2>
      <p class="help">Pick a time for a quick call. Your answers come with you, so we can skip the small talk and get straight into it.</p>
      <div class="actions">
        ${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Book my call <span class="arr">→</span></a>`:`<span class="btn" aria-disabled="true" style="opacity:.55">Booking link coming soon</span>`}
        <button class="btn ghost" id="edit" type="button">Change my answers</button>
      </div>
      ${summary()}
    </div>`;
  }else{
    const reason = A.hours==="Under 5" ? "1-on-1 needs a few hours a week to be worth it." : "You don't need 1-on-1 to get started.";
    el.innerHTML=`<div class="fade">
      <h2>Thanks, ${esc(A.name||"you")}. The best place to start is <em>the Lab.</em></h2>
      <p class="help">${reason} The Lab is where to begin. When you're ready for 1-on-1, apply again.</p>
      <div class="actions">
        <a class="btn" href="${esc(LAB_URL)}" target="_blank" rel="noopener">Go to the Lab <span class="arr">→</span></a>
        <button class="btn ghost" id="edit" type="button">Change my answers</button>
      </div>
    </div>`;
  }
  document.getElementById("edit").onclick=()=>show(0);
}

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if((e.key==="Enter"||e.key===" ")&&e.target.tagName==="BUTTON") return;
  const typing=e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA";
  if(!PATH){
    const k=e.key.toUpperCase();
    if(!typing&&(k==="A"||k==="B")){e.preventDefault();start(k==="A"?"mentor":"work")}
    return;
  }
  if(i<0&&e.key==="Enter"){e.preventDefault();show(0);return}
  if(i<0||i>=Q.length) return;
  const q=Q[i];
  if(q.type==="choice"){
    const k=e.key.toUpperCase();
    const idx=k.length===1?k.charCodeAt(0)-65:-1;
    if(idx>=0&&idx<q.options.length&&!typing){e.preventDefault();pick(q,q.options[idx]);return}
    if(e.key==="Enter"&&A[q.id]&&e.target.classList&&!e.target.classList.contains("choice")){e.preventDefault();show(i+1)}
  }else if(e.key==="Enter"&&!(q.type==="long"&&e.shiftKey)){
    e.preventDefault();submitText(q);
  }
});

home();
</script>
